# Copy the relevant settings into ~/.omp/agent/config.yml.
# Before copying, run:
#   omp models deepseek
#   omp models openai-codex
# and confirm the selectors available on your installation/account.

modelRoles:
  default: deepseek/deepseek-v4-flash:off
  task: deepseek/deepseek-v4-flash:off
  smol: openai-codex/gpt-5.6-luna:medium
  tiny: openai-codex/gpt-5.6-luna:medium

  vision: openai-codex/gpt-5.6-luna:medium
  commit: openai-codex/gpt-5.6-luna:low
  advisor: openai-codex/gpt-5.6-luna:max

  plan: openai-codex/gpt-5.6-sol:high
  slow: openai-codex/gpt-5.6-sol:high

advisor:
  enabled: false

